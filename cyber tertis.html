<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Neon Cyber Tetris</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap');

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }

        body {
            margin: 0;
            padding: 10px;
            background: radial-gradient(circle at center, #1a0033 0%, #050011 100%);
            font-family: 'Orbitron', sans-serif;
            color: #fff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
        }

        .game-layout {
            display: flex;
            gap: 20px;
            align-items: flex-start;
            background: rgba(20, 0, 40, 0.6);
            backdrop-filter: blur(10px);
            border: 2px solid #ff00ff;
            box-shadow: 0 0 25px rgba(255, 0, 255, 0.4), inset 0 0 15px rgba(0, 243, 255, 0.2);
            border-radius: 15px;
            padding: 20px;
        }

        .main-section {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .board-wrapper {
            position: relative;
        }

        canvas {
            display: block;
            background: rgba(5, 0, 15, 0.85);
            border: 2px solid #00f3ff;
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.5);
            border-radius: 8px;
            width: 240px;
            height: 480px;
        }

        .side-panel {
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 180px;
        }

        .panel-box {
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid #ff00ff;
            border-radius: 8px;
            padding: 12px;
            text-align: center;
            box-shadow: inset 0 0 10px rgba(255, 0, 255, 0.2);
        }

        .panel-box h3 {
            margin: 0 0 8px 0;
            font-size: 12px;
            color: #00f3ff;
            letter-spacing: 1px;
            text-shadow: 0 0 5px #00f3ff;
        }

        .panel-box .value {
            font-size: 18px;
            font-weight: 700;
            color: #fff;
            text-shadow: 0 0 10px #ff00ff;
        }

        .controls-guide {
            font-size: 11px;
            color: #b19cd9;
            line-height: 1.6;
            text-align: left;
        }

        .controls-guide span {
            color: #00f3ff;
            font-weight: bold;
        }

        /* 터치 조작 패드 */
        .touch-controls {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 6px;
            margin-top: 5px;
        }

        .control-btn {
            background: rgba(0, 243, 255, 0.1);
            border: 2px solid #00f3ff;
            color: #00f3ff;
            padding: 10px 0;
            font-family: 'Orbitron', sans-serif;
            font-size: 13px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            box-shadow: 0 0 6px rgba(0, 243, 255, 0.3);
            text-align: center;
            transition: all 0.1s;
        }

        .control-btn:active {
            background: #00f3ff;
            color: #050011;
            box-shadow: 0 0 12px #00f3ff;
        }

        .control-btn.action-drop {
            border-color: #ff00ff;
            color: #ff00ff;
            box-shadow: 0 0 6px rgba(255, 0, 255, 0.3);
            grid-column: span 2;
        }

        .control-btn.action-drop:active {
            background: #ff00ff;
            color: #050011;
            box-shadow: 0 0 12px #ff00ff;
        }

        /* 게임 종료(QUIT) 버튼 스타일 */
        .quit-btn {
            width: 100%;
            background: rgba(255, 0, 85, 0.15);
            border: 2px solid #ff0055;
            color: #ff0055;
            padding: 10px;
            font-family: 'Orbitron', sans-serif;
            font-size: 12px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            box-shadow: 0 0 8px rgba(255, 0, 85, 0.3);
            transition: all 0.1s;
        }

        .quit-btn:active, .quit-btn:hover {
            background: #ff0055;
            color: #fff;
            box-shadow: 0 0 15px #ff0055;
        }

        /* 모바일 화면 대응 */
        @media (max-width: 600px) {
            .game-layout {
                flex-direction: column;
                align-items: center;
                padding: 12px;
                gap: 12px;
            }
            .side-panel {
                width: 240px;
                flex-direction: row;
                flex-wrap: wrap;
                justify-content: space-between;
            }
            .panel-box {
                flex: 1;
                min-width: 70px;
                padding: 8px;
            }
            .side-panel .controls-guide {
                display: none; 
            }
            .mobile-bottom-area {
                width: 100%;
                display: flex;
                flex-direction: column;
                gap: 8px;
            }
            .touch-controls {
                grid-template-columns: repeat(4, 1fr);
                width: 100%;
                margin-top: 0;
            }
            .control-btn.action-drop {
                grid-column: span 1;
            }
        }

        /* 오버레이 화면 */
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(5, 0, 15, 0.9);
            backdrop-filter: blur(5px);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
            border-radius: 8px;
        }

        .overlay h1 {
            font-size: 24px;
            color: #ff00ff;
            text-shadow: 0 0 15px #ff00ff;
            margin-bottom: 20px;
            text-align: center;
        }

        .btn {
            background: linear-gradient(45deg, #ff00ff, #00f3ff);
            border: none;
            color: #fff;
            padding: 12px 25px;
            font-family: 'Orbitron', sans-serif;
            font-size: 16px;
            font-weight: bold;
            border-radius: 25px;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.6);
        }
    </style>
</head>
<body>

    <div class="game-layout">
        <!-- 좌측 정보 영역 -->
        <div class="side-panel">
            <div class="panel-box">
                <h3>NEXT</h3>
                <canvas id="next-canvas" width="60" height="60" style="width:60px; height:60px; margin:0 auto; display:block; background:transparent; border:none; box-shadow:none;"></canvas>
            </div>
            <div class="panel-box">
                <h3>SCORE</h3>
                <div id="score" class="value">0</div>
            </div>
            <div class="panel-box">
                <h3>LEVEL</h3>
                <div id="level" class="value">1</div>
            </div>
        </div>

        <!-- 중앙 게임 보드 영역 -->
        <div class="main-section">
            <div class="board-wrapper">
                <canvas id="tetris" width="300" height="600"></canvas>
                
                <div id="start-screen" class="overlay">
                    <h1>CYBER<br>TETRIS</h1>
                    <button class="btn" onclick="startGame()">GAME START</button>
                </div>
                
                <div id="gameover-screen" class="overlay" style="display: none;">
                    <h1>GAME OVER</h1>
                    <p id="final-score" style="margin-bottom: 20px; font-size: 14px; color: #00f3ff;">SCORE: 0</p>
                    <button class="btn" onclick="startGame()">PLAY AGAIN</button>
                </div>
            </div>
        </div>

        <!-- 우측 조작 가이드, 종료 버튼 및 터치 패드 -->
        <div class="side-panel">
            <div class="panel-box controls-guide">
                <h3>CONTROLS</h3>
                <div><span>← →</span> 이동</div>
                <div><span>↑</span> 회전</div>
                <div><span>↓</span> 소프트</div>
                <div><span>SPACE</span> 하드</div>
            </div>

            <div class="mobile-bottom-area">
                <button class="quit-btn" onclick="quitGame()">QUIT GAME</button>
                
                <div class="panel-box" style="margin-top: 5px;">
                    <h3>TOUCH PAD</h3>
                    <div class="touch-controls">
                        <button class="control-btn" onclick="playerMove(-1)">◀</button>
                        <button class="control-btn" onclick="playerRotate(1)">🔄</button>
                        <button class="control-btn" onclick="playerDrop()">▼</button>
                        <button class="control-btn" onclick="playerMove(1)">▶</button>
                        <button class="control-btn action-drop" onclick="playerHardDrop()">🚀 DROP</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

<script>
    const canvas = document.getElementById('tetris');
    const ctx = canvas.getContext('2d');
    const nextCanvas = document.getElementById('next-canvas');
    const nextCtx = nextCanvas.getContext('2d');

    const BLOCK_SIZE = 30;
    const COLS = 10;
    const ROWS = 20;

    ctx.scale(BLOCK_SIZE, BLOCK_SIZE);
    nextCtx.scale(BLOCK_SIZE, BLOCK_SIZE);

    const COLORS = [
        null,
        '#00f3ff', '#ff00ff', '#ff9900', '#ffff00', '#00ff66', '#9900ff', '#ff0055'
    ];

    const SHAPES = [
        [],
        [[0, 1, 0, 0], [0, 1, 0, 0], [0, 1, 0, 0], [0, 1, 0, 0]],
        [[2, 0, 0], [2, 2, 2], [0, 0, 0]],
        [[0, 0, 3], [3, 3, 3], [0, 0, 0]],
        [[4, 4], [4, 4]],
        [[0, 5, 5], [5, 5, 0], [0, 0, 0]],
        [[0, 6, 0], [6, 6, 6], [0, 0, 0]],
        [[7, 7, 0], [0, 7, 7], [0, 0, 0]]
    ];

    let arena = createMatrix(COLS, ROWS);
    let score = 0;
    let level = 1;
    let dropInterval = 1000;
    let dropCounter = 0;
    let lastTime = 0;
    let gameOverFlag = true;

    const player = { pos: {x: 0, y: 0}, matrix: null };
    const nextPlayer = { matrix: null };

    function createMatrix(w, h) {
        const matrix = [];
        while (h--) matrix.push(new Array(w).fill(0));
        return matrix;
    }

    function createPiece(type) { return SHAPES[type]; }

    function drawMatrix(matrix, offset, context = ctx, isNext = false) {
        matrix.forEach((row, y) => {
            row.forEach((value, x) => {
                if (value !== 0) {
                    context.fillStyle = COLORS[value];
                    context.shadowColor = COLORS[value];
                    context.shadowBlur = isNext ? 3 : 8;
                    context.fillRect(x + offset.x, y + offset.y, 1, 1);
                    context.strokeStyle = '#ffffff';
                    context.lineWidth = 0.05;
                    context.strokeRect(x + offset.x, y + offset.y, 1, 1);
                }
            });
        });
        context.shadowBlur = 0;
    }

    function draw() {
        // 배경 초기화
        ctx.fillStyle = 'rgba(5, 0, 15, 0.4)';
        ctx.fillRect(0, 0, COLS, ROWS);

        // 🔲 테트리스 보드 격자(Grid) 그리기
        ctx.strokeStyle = 'rgba(0, 243, 255, 0.12)';
        ctx.lineWidth = 0.03;
        for (let x = 0; x < COLS; x++) {
            ctx.beginPath();
            ctx.moveTo(x, 0);
            ctx.lineTo(x, ROWS);
            ctx.stroke();
        }
        for (let y = 0; y < ROWS; y++) {
            ctx.beginPath();
            ctx.moveTo(0, y);
            ctx.lineTo(COLS, y);
            ctx.stroke();
        }

        drawMatrix(arena, {x: 0, y: 0});
        if (!gameOverFlag && player.matrix) {
            drawMatrix(player.matrix, player.pos);
        }
    }

    function drawNext() {
        nextCtx.fillStyle = 'rgba(0, 0, 0, 0)';
        nextCtx.fillRect(0, 0, nextCanvas.width, nextCanvas.height);
        const matrix = nextPlayer.matrix;
        if (!matrix) return;
        const offset = {
            x: (2 - matrix[0].length) / 2,
            y: (2 - matrix.length) / 2
        };
        drawMatrix(matrix, offset, nextCtx, true);
    }

    function merge(arena, player) {
        player.matrix.forEach((row, y) => {
            row.forEach((value, x) => {
                if (value !== 0) arena[y + player.pos.y][x + player.pos.x] = value;
            });
        });
    }

    function rotate(matrix, dir) {
        for (let y = 0; y < matrix.length; ++y) {
            for (let x = 0; x < y; ++x) {
                [matrix[x][y], matrix[y][x]] = [matrix[y][x], matrix[x][y]];
            }
        }
        if (dir > 0) matrix.forEach(row => row.reverse());
        else matrix.reverse();
    }

    function playerRotate(dir) {
        if (gameOverFlag) return;
        const posX = player.pos.x;
        let offset = 1;
        rotate(player.matrix, dir);
        while (collide(arena, player)) {
            player.pos.x += offset;
            offset = -(offset + (offset > 0 ? 1 : -1));
            if (offset > player.matrix[0].length) {
                rotate(player.matrix, -dir);
                player.pos.x = posX;
                return;
            }
        }
    }

    function collide(arena, player) {
        const m = player.matrix;
        const o = player.pos;
        for (let y = 0; y < m.length; ++y) {
            for (let x = 0; x < m[y].length; ++x) {
                if (m[y][x] !== 0 && (arena[y + o.y] && arena[y + o.y][x + o.x]) !== 0) return true;
            }
        }
        return false;
    }

    function playerDrop() {
        if (gameOverFlag) return;
        player.pos.y++;
        if (collide(arena, player)) {
            player.pos.y--;
            merge(arena, player);
            playerReset();
            arenaSweep();
            updateScore();
        }
        dropCounter = 0;
    }

    function playerHardDrop() {
        if (gameOverFlag) return;
        while (!collide(arena, player)) {
            player.pos.y++;
        }
        player.pos.y--;
        merge(arena, player);
        playerReset();
        arenaSweep();
        updateScore();
        dropCounter = 0;
    }

    function playerMove(dir) {
        if (gameOverFlag) return;
        player.pos.x += dir;
        if (collide(arena, player)) player.pos.x -= dir;
    }

    function playerReset() {
        if (nextPlayer.matrix === null) {
            nextPlayer.matrix = createPiece(Math.floor(Math.random() * 7) + 1);
        }
        player.matrix = nextPlayer.matrix;
        nextPlayer.matrix = createPiece(Math.floor(Math.random() * 7) + 1);
        player.pos.y = 0;
        player.pos.x = Math.floor((COLS - player.matrix[0].length) / 2);

        if (collide(arena, player)) {
            gameOverFlag = true;
            document.getElementById('final-score').innerText = `SCORE: ${score}`;
            document.getElementById('gameover-screen').style.display = 'flex';
        }
        drawNext();
    }

    function arenaSweep() {
        let rowCount = 1;
        outer: for (let y = arena.length - 1; y > 0; --y) {
            for (let x = 0; x < arena[y].length; ++x) {
                if (arena[y][x] === 0) continue outer;
            }
            const row = arena.splice(y, 1)[0].fill(0);
            arena.unshift(row);
            y++;
            score += rowCount * 100;
            rowCount *= 2;
        }
        level = Math.floor(score / 500) + 1;
        dropInterval = Math.max(150, 1000 - (level - 1) * 100);
    }

    function updateScore() {
        document.getElementById('score').innerText = score;
        document.getElementById('level').innerText = level;
    }

    function update(time = 0) {
        if (gameOverFlag) return;
        const deltaTime = time - lastTime;
        lastTime = time;
        dropCounter += deltaTime;

        if (dropCounter > dropInterval) playerDrop();
        draw();
        requestAnimationFrame(update);
    }

    document.addEventListener('keydown', event => {
        if (gameOverFlag) return;
        if (event.key === 'ArrowLeft') playerMove(-1);
        else if (event.key === 'ArrowRight') playerMove(1);
        else if (event.key === 'ArrowDown') playerDrop();
        else if (event.key === 'ArrowUp') playerRotate(1);
        else if (event.key === ' ') { event.preventDefault(); playerHardDrop(); }
    });

    function startGame() {
        arena.forEach(row => row.fill(0));
        score = 0;
        level = 1;
        dropInterval = 1000;
        gameOverFlag = false;
        updateScore();
        
        document.getElementById('start-screen').style.display = 'none';
        document.getElementById('gameover-screen').style.display = 'none';
        
        nextPlayer.matrix = createPiece(Math.floor(Math.random() * 7) + 1);
        playerReset();
        lastTime = performance.now();
        update();
    }

    function quitGame() {
        gameOverFlag = true;
        arena.forEach(row => row.fill(0));
        draw();
        document.getElementById('start-screen').style.display = 'flex';
        document.getElementById('gameover-screen').style.display = 'none';
    }
</script>
</body>
</html>
